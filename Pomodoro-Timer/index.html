<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pomodoro — a focus timer</title>
<meta name="description" content="A simple Pomodoro timer for work sessions and breaks.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,470;0,9..144,600;1,9..144,470&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E3DED2;
    --paper-raised: #EDE9DF;
    --ink: #24221E;
    --ink-soft: #6B6659;
    --line: #C9C2AE;

    --work: #A8472B;
    --work-soft: #F0D9CD;
    --short: #4C6B50;
    --short-soft: #DCE6DA;
    --long: #395B76;
    --long-soft: #D7E0E6;

    --accent: var(--work);
    --accent-soft: var(--work-soft);

    --radius-sm: 6px;
    --radius-lg: 14px;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1C1A16;
      --paper-raised: #252320;
      --ink: #EDE8DC;
      --ink-soft: #ABA495;
      --line: #3A362E;

      --work: #D98160;
      --work-soft: #3A2620;
      --short: #87AC8B;
      --short-soft: #233024;
      --long: #87AFCB;
      --long-soft: #1F2E38;
    }
  }

  :root[data-theme="dark"] {
    --paper: #1C1A16;
    --paper-raised: #252320;
    --ink: #EDE8DC;
    --ink-soft: #ABA495;
    --line: #3A362E;

    --work: #D98160;
    --work-soft: #3A2620;
    --short: #87AC8B;
    --short-soft: #233024;
    --long: #87AFCB;
    --long-soft: #1F2E38;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.25rem 1.25rem;
    padding-top: calc(2.25rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(2.25rem + env(safe-area-inset-bottom, 0px));
    transition: background 0.4s ease, color 0.4s ease;
  }

  .app {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6rem;
  }

  header {
    text-align: center;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 470;
    font-size: 1.9rem;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .tagline {
    margin: 0.35rem 0 0;
    color: var(--ink-soft);
    font-size: 0.8rem;
    line-height: 1.5;
  }

  .phase-label {
    margin: 0;
    font-size: 0.95rem;
    color: var(--accent);
    font-weight: 700;
    transition: color 0.4s ease;
    min-height: 1.4em;
  }

  .ring-wrap {
    position: relative;
    width: min(78vw, 280px);
    height: min(78vw, 280px);
  }

  .ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track,
  .ring-progress {
    fill: none;
    stroke-width: 7;
  }

  .ring-track {
    stroke: var(--line);
  }

  .ring-progress {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-progress { transition: stroke 0.4s ease; }
  }

  .time-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #timeText {
    font-size: clamp(2.6rem, 11vw, 3.4rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .session-dots {
    display: flex;
    gap: 0.5rem;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.3s ease;
  }

  .dot.filled {
    background: var(--accent);
  }

  .session-count {
    margin: -0.8rem 0 0;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .controls {
    display: flex;
    gap: 0.6rem;
    width: 100%;
    justify-content: center;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: var(--radius-sm);
    padding: 0.75rem 1.4rem;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--paper);
    min-width: 7.5rem;
  }

  .btn-primary:hover {
    filter: brightness(1.08);
  }

  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
  }

  .btn-ghost:hover {
    background: var(--paper-raised);
  }

  .btn:focus-visible,
  .settings-toggle:focus-visible,
  input:focus-visible {
    outline: 2.5px solid var(--accent);
    outline-offset: 2px;
  }

  .settings-toggle {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0.3rem;
  }

  .settings-toggle:hover {
    color: var(--ink);
  }

  .settings-panel {
    width: 100%;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.3rem 1.4rem;
  }

  .settings-panel h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 1rem;
  }

  #settingsForm {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  #settingsForm label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  #settingsForm input {
    width: 4.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.4rem 0.5rem;
    text-align: center;
  }

  .settings-save-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-top: 0.3rem;
  }

  .save-note {
    font-size: 0.72rem;
    color: var(--ink-soft);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .save-note.visible {
    opacity: 1;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .pulse {
    animation: pulse 0.6s ease-in-out 2;
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; }
  }
</style>
</head>
<body>

  <div class="app" id="app" data-phase="work">

    <header>
      <h1>Pomodoro</h1>
      <p class="tagline">25 minutes of focus, then a short breath.</p>
    </header>

    <p class="phase-label" id="phaseLabel">Focus session</p>

    <div class="ring-wrap" id="ringWrap">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="time-display">
        <span id="timeText">25:00</span>
      </div>
    </div>

    <div class="session-dots" id="sessionDots" aria-hidden="true"></div>
    <p class="session-count" id="sessionCount">0 focus sessions completed</p>

    <div class="controls">
      <button id="startPauseBtn" class="btn btn-primary" type="button">Start</button>
      <button id="resetBtn" class="btn btn-ghost" type="button">Reset</button>
      <button id="skipBtn" class="btn btn-ghost" type="button">Skip</button>
    </div>

    <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settingsPanel">
      Timer settings
    </button>

    <section id="settingsPanel" class="settings-panel" hidden>
      <h2>Timer settings</h2>
      <form id="settingsForm">
        <label for="workInput">Focus length (minutes)
          <input type="number" id="workInput" min="1" max="90" value="25" inputmode="numeric">
        </label>
        <label for="shortInput">Short break (minutes)
          <input type="number" id="shortInput" min="1" max="30" value="5" inputmode="numeric">
        </label>
        <label for="longInput">Long break (minutes)
          <input type="number" id="longInput" min="1" max="60" value="15" inputmode="numeric">
        </label>
        <label for="cyclesInput">Sessions before long break
          <input type="number" id="cyclesInput" min="1" max="12" value="4" inputmode="numeric">
        </label>
        <div class="settings-save-row">
          <button type="submit" class="btn btn-primary">Save &amp; restart</button>
          <span class="save-note" id="saveNote">Saved</span>
        </div>
      </form>
    </section>

    <div aria-live="polite" class="sr-only" id="liveRegion"></div>
  </div>

<script>
(function () {
  'use strict';

  var CIRCUMFERENCE = 2 * Math.PI * 90;

  var state = {
    durations: { work: 25 * 60, short: 5 * 60, long: 15 * 60 },
    cyclesBeforeLong: 4,
    phase: 'work',           // 'work' | 'short' | 'long'
    remaining: 25 * 60,
    running: false,
    completedWorkSessions: 0,
    intervalId: null
  };

  var els = {
    app: document.getElementById('app'),
    phaseLabel: document.getElementById('phaseLabel'),
    timeText: document.getElementById('timeText'),
    ringProgress: document.getElementById('ringProgress'),
    ringWrap: document.getElementById('ringWrap'),
    sessionDots: document.getElementById('sessionDots'),
    sessionCount: document.getElementById('sessionCount'),
    startPauseBtn: document.getElementById('startPauseBtn'),
    resetBtn: document.getElementById('resetBtn'),
    skipBtn: document.getElementById('skipBtn'),
    settingsToggle: document.getElementById('settingsToggle'),
    settingsPanel: document.getElementById('settingsPanel'),
    settingsForm: document.getElementById('settingsForm'),
    workInput: document.getElementById('workInput'),
    shortInput: document.getElementById('shortInput'),
    longInput: document.getElementById('longInput'),
    cyclesInput: document.getElementById('cyclesInput'),
    saveNote: document.getElementById('saveNote'),
    liveRegion: document.getElementById('liveRegion')
  };

  els.ringProgress.style.strokeDasharray = CIRCUMFERENCE.toFixed(2);

  var PHASE_META = {
    work: { label: 'Focus session', className: 'work' },
    short: { label: 'Short break', className: 'short' },
    long: { label: 'Long break', className: 'long' }
  };

  function formatTime(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function announce(message) {
    els.liveRegion.textContent = message;
  }

  function renderDots() {
    els.sessionDots.innerHTML = '';
    var n = state.cyclesBeforeLong;
    var filled = state.completedWorkSessions % n;
    if (filled === 0 && state.completedWorkSessions > 0 && state.phase !== 'work') {
      filled = n;
    }
    for (var i = 0; i < n; i++) {
      var dot = document.createElement('span');
      dot.className = 'dot' + (i < filled ? ' filled' : '');
      els.sessionDots.appendChild(dot);
    }
  }

  function render() {
    var meta = PHASE_META[state.phase];
    els.app.setAttribute('data-phase', state.phase);
    els.phaseLabel.textContent = meta.label;
    els.timeText.textContent = formatTime(state.remaining);

    var total = state.durations[state.phase];
    var fractionElapsed = 1 - (state.remaining / total);
    var offset = CIRCUMFERENCE * fractionElapsed;
    els.ringProgress.style.strokeDashoffset = offset.toFixed(2);

    els.startPauseBtn.textContent = state.running ? 'Pause' : 'Start';
    els.sessionCount.textContent = state.completedWorkSessions + ' focus session' +
      (state.completedWorkSessions === 1 ? '' : 's') + ' completed';

    renderDots();
    document.title = formatTime(state.remaining) + ' · ' + meta.label;
  }

  function playChime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var now = ctx.currentTime;
      var notes = [660, 880];
      notes.forEach(function (freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + i * 0.22);
        gain.gain.linearRampToValueAtTime(0.18, now + i * 0.22 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.22 + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.22);
        osc.stop(now + i * 0.22 + 0.45);
      });
    } catch (e) {
      // Audio not available; fail silently.
    }
  }

  function pulseRing() {
    els.ringWrap.classList.remove('pulse');
    void els.ringWrap.offsetWidth; // restart animation
    els.ringWrap.classList.add('pulse');
  }

  function nextPhase() {
    if (state.phase === 'work') {
      state.completedWorkSessions += 1;
      var onLongBreak = state.completedWorkSessions % state.cyclesBeforeLong === 0;
      state.phase = onLongBreak ? 'long' : 'short';
    } else {
      state.phase = 'work';
    }
    state.remaining = state.durations[state.phase];
  }

  function tick() {
    state.remaining -= 1;
    if (state.remaining <= 0) {
      playChime();
      pulseRing();
      var finishedPhase = PHASE_META[state.phase].label;
      nextPhase();
      announce(finishedPhase + ' finished. Starting ' + PHASE_META[state.phase].label.toLowerCase() + '.');
      render();
      return;
    }
    render();
  }

  function startTimer() {
    if (state.running) return;
    state.running = true;
    state.intervalId = setInterval(tick, 1000);
    render();
  }

  function pauseTimer() {
    state.running = false;
    clearInterval(state.intervalId);
    render();
  }

  function resetTimer() {
    pauseTimer();
    state.phase = 'work';
    state.remaining = state.durations.work;
    announce('Timer reset.');
    render();
  }

  function skipPhase() {
    pauseTimer();
    nextPhase();
    announce('Skipped to ' + PHASE_META[state.phase].label.toLowerCase() + '.');
    render();
  }

  els.startPauseBtn.addEventListener('click', function () {
    state.running ? pauseTimer() : startTimer();
  });
  els.resetBtn.addEventListener('click', resetTimer);
  els.skipBtn.addEventListener('click', skipPhase);

  els.settingsToggle.addEventListener('click', function () {
    var isHidden = els.settingsPanel.hasAttribute('hidden');
    if (isHidden) {
      els.settingsPanel.removeAttribute('hidden');
      els.settingsToggle.setAttribute('aria-expanded', 'true');
    } else {
      els.settingsPanel.setAttribute('hidden', '');
      els.settingsToggle.setAttribute('aria-expanded', 'false');
    }
  });

  els.settingsForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var work = Math.max(1, parseInt(els.workInput.value, 10) || 25);
    var short = Math.max(1, parseInt(els.shortInput.value, 10) || 5);
    var long = Math.max(1, parseInt(els.longInput.value, 10) || 15);
    var cycles = Math.max(1, parseInt(els.cyclesInput.value, 10) || 4);

    state.durations.work = work * 60;
    state.durations.short = short * 60;
    state.durations.long = long * 60;
    state.cyclesBeforeLong = cycles;

    pauseTimer();
    state.phase = 'work';
    state.remaining = state.durations.work;
    state.completedWorkSessions = 0;

    render();
    announce('Settings saved. Timer reset to a new focus session.');

    els.saveNote.classList.add('visible');
    setTimeout(function () { els.saveNote.classList.remove('visible'); }, 1800);
  });

  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space') {
      e.preventDefault();
      state.running ? pauseTimer() : startTimer();
    }
  });

  render();
})();
</script>

</body>
</html>
